      - name: Installation de gitleaks
        shell: bash
        # Version fixée, archive vérifiée par sa somme SHA-256 (gitleaks_8.30.1_checksums.txt).
        run: |
          case "$RUNNER_OS" in
            Linux) f=gitleaks_8.30.1_linux_x64.tar.gz s=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            Windows) f=gitleaks_8.30.1_windows_x64.zip s=d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e ;;
            macOS) f=gitleaks_8.30.1_darwin_arm64.tar.gz s=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
          esac
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$f"
          if command -v sha256sum >/dev/null; then somme=(sha256sum); else somme=(shasum -a 256); fi
          echo "$s  $RUNNER_TEMP/$f" | "${somme[@]}" -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          case "$f" in
            *.zip) unzip -q -o "$RUNNER_TEMP/$f" -d "$RUNNER_TEMP/gitleaks" ;;
            *) tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/gitleaks" ;;
          esac
          echo "$RUNNER_TEMP/gitleaks" >>"$GITHUB_PATH"
