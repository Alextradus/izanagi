      # Faits cargo-llvm-cov, lus le 2026-11-19 sur https://github.com/taiki-e/cargo-llvm-cov :
      # - L'installation conseillée en CI passe par taiki-e/install-action.
      # - L'outil emploie le composant `llvm-tools-preview`. La page ne dit pas
      #   ce qui se passe quand il manque (variable CARGO_LLVM_COV_SETUP) :
      #   l'étape suivante l'ajoute.
      - name: Composant llvm-tools-preview
        shell: bash
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov@0.9.1
