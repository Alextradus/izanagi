# Contrôle hebdomadaire de sécurité : secrets sur tout l'historique et audit des
# dépendances. En cas d'échec, ouvre une issue étiquetée `securite`, ou commente
# celle qui est ouverte. Ce job seul a le droit d'écrire des issues.
name: Sécurité

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  securite:
    name: contrôle hebdomadaire
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
{{ci_gitleaks}}
      - name: Secrets, tout l'historique
        shell: bash
        run: gitleaks git --redact --no-banner .
{{ci_audit}}
      - name: Issue de sécurité
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create securite --color B60205 --description "Contrôle de sécurité en échec" --force
          numero="$(gh issue list --label securite --state open --json number --jq '.[0].number')"
          if [[ -n $numero ]]; then
            gh issue comment "$numero" --body "Le contrôle hebdomadaire échoue encore : $RUN_URL"
          else
            gh issue create --title "Sécurité : contrôle hebdomadaire en échec" --label securite \
              --body "Le contrôle hebdomadaire de sécurité échoue. Le détail est dans le journal du job : $RUN_URL"
          fi
