# Actions épinglées par SHA, avec l'étiquette en commentaire. Dependabot
# (.github/dependabot.yml) propose leurs mises à jour.
name: CI

on:
  push:
    branches: ["{{branche}}"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: {{ci_os}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Tout l'historique : la recherche de secrets lit la plage depuis la branche principale.
          fetch-depth: 0
{{ci_gitleaks}}
{{ci_setup}}
{{ci_playwright}}
      - name: Vérifications
        shell: bash
{{ci_navigateur}}
        run: bash scripts/check.sh --host --complet

  # Couverture des tests, sur Ubuntu seulement. Sans seuil : le job ne fait
  # jamais échouer la PR.
  couverture:
    name: couverture
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
{{ci_gitleaks}}
{{ci_setup}}
{{ci_playwright_couverture}}
{{ci_couverture}}
      - name: Vérifications avec couverture
        shell: bash
        run: IZANAGI_COUVERTURE=1 bash scripts/check.sh --host --complet

  audit:
    name: audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
{{ci_audit}}
